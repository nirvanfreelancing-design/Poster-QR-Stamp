plugins { id 'com.android.application' }

def ks = System.getenv("KEYSTORE_FILE")
def vc = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'app.vsk.posterqr'
    compileSdk 34

    defaultConfig {
        applicationId 'app.vsk.posterqr'
        minSdk 29
        targetSdk 34
        versionCode vc
        versionName "1.0." + vc
    }

    signingConfigs {
        release {
            if (ks && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = (ks && new File(ks).exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
